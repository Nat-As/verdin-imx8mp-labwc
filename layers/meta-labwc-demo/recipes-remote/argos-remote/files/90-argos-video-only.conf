# WirePlumber runs for the screen capture streams of the remote desktop
# (argos-remote) only. It runs in two user sessions at once (touch screen and
# admin desktop), which must not compete for the sound cards, Bluetooth audio
# or cameras, so its hardware monitors are off; audio is unchanged (the image
# has no sound server).
wireplumber.profiles = {
  main = {
    hardware.audio = disabled
    hardware.bluetooth = disabled
    hardware.video-capture = disabled
  }
}
