# meta-labwc-demo: labwc Wayland desktop demo for Toradex Verdin iMX8M Plus
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "labwc-demo"
BBFILE_PATTERN_labwc-demo = "^${LAYERDIR}/"
# Above Toradex/NXP/meta-wayland so our bbappends/config win
BBFILE_PRIORITY_labwc-demo = "30"

LAYERSERIES_COMPAT_labwc-demo = "scarthgap"
LAYERDEPENDS_labwc-demo = "core openembedded-layer wayland toradex-demos"

# tdx-reference-multimedia-image inherits populate_sdk_qt5 (meta-qt5). This
# build uses Qt 6 (meta-qt6) instead of meta-qt5, and labwc-demo-image does
# not use that recipe, so keep it from being parsed.
BBMASK += "meta-toradex-demos/recipes-images/images/tdx-reference-multimedia-image\.bb"
