# Boot splash: build the display chain of the Verdin iMX8M Plus on Mallow
# into the kernel. imx-drm only binds when all of its components exist; with
# the DSI host, DSI-to-LVDS bridge, LVDS panel and backlight as modules, the
# display came up at ~6.5 s (after udev loaded the modules). Built in, it is
# ready before userspace starts, so the boot splash can show right away.
CONFIG_DRM_SEC_MIPI_DSIM=y
CONFIG_DRM_IMX_SEC_DSIM=y
CONFIG_DRM_TI_SN65DSI83=y
CONFIG_DRM_PANEL_LVDS=y
CONFIG_BACKLIGHT_PWM=y
CONFIG_PWM_IMX27=y
CONFIG_PHY_SAMSUNG_HDMI_PHY=y

# Don't let the framebuffer console take over the display (and show text or
# a cursor) unless text is actually printed to it. Kernel messages go to the
# serial console only; the display stays dark until the splash draws.
CONFIG_FRAMEBUFFER_CONSOLE_DEFERRED_TAKEOVER=y
