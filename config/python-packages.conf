# ============================================================================
# Python packages installed in labwc-demo-image
# ============================================================================
# This file is included by build/conf/local.conf. Edit the list below, then
# rebuild with ./build.sh. Use Yocto package names (python3-<module>), one per
# line, keeping the trailing "\". Python is 3.12 (the version in Yocto
# Scarthgap). Libraries that are not packaged in Yocto can be installed on the
# board with "pip3 install --user <name>".
# ============================================================================

LABWC_DEMO_PYTHON_PACKAGES = "\
    python3 \
    python3-modules \
    python3-pip \
    python3-venv \
    python3-dev \
    \
    python3-numpy \
    python3-scipy \
    python3-pandas \
    python3-matplotlib \
    python3-opencv \
    python3-pillow \
    python3-pyqt6 \
    python3-tkinter \
"
# Notes:
# - python3-modules installs the whole standard library (pickle, json, sqlite3,
#   asyncio, ...).
# - python3-scipy needs a Fortran-enabled toolchain (FORTRAN in local.conf).
# - python3-pyqt6 provides the Qt 6 bindings; matplotlib uses Qt (QtAgg) for
#   its windows.
# - python3-tkinter is installed, but Tk is an X11 toolkit: tkinter windows
#   need an X server (Xwayland), which this pure Wayland image does not run.
