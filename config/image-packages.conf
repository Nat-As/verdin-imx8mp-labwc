# ============================================================================
# Extra software installed in labwc-demo-image
# ============================================================================
# This file is included by build/conf/local.conf. Edit the lists below, then
# rebuild with ./build.sh.
#
# - Use Yocto *package* names, one per line, keeping the trailing "\".
#   To check whether a package exists:  . ./export && oe-pkgdata-util find-path <file>
#   or search https://layers.openembedded.org (filter by branch "scarthgap").
# - Python libraries are listed separately in config/python-packages.conf.
# ============================================================================

LABWC_DEMO_PACKAGES = "\
    \
    fish \
    nano \
    neofetch \
    htop \
    tmux \
    git \
    curl \
    wget \
    rsync \
    nmap \
    tree \
    gzip \
    man-db \
    man-pages \
    usbutils \
    pciutils \
    \
    networkmanager \
    networkmanager-nmcli \
    networkmanager-nmtui \
    networkmanager-wifi \
    \
    bluez5 \
    blueman \
    \
    packagegroup-core-buildessential \
    cmake \
    meson \
    ninja \
    pkgconfig \
    gdb \
    wayland \
    wayland-dev \
    wayland-tools \
    wayland-protocols \
    libxkbcommon-dev \
    \
    qtbase \
    qtbase-plugins \
    qtbase-tools \
    qtwayland \
    qtwayland-plugins \
    qtdeclarative \
    qtdeclarative-qmlplugins \
    qtdeclarative-tools \
    qtsvg \
    qtsvg-plugins \
    \
    kernel-modules \
    realtek-r8152 \
    linux-firmware-rtl-nic \
"
# Sections above: shells and command line tools (gzip = GNU gzip/gunzip,
# man-db = "man") / NetworkManager (replaces
# connman) / Bluetooth / C and C++ development tools and Wayland headers /
# Qt 6 (meta-qt6, branch 6.11) / drivers and firmware.
# kernel-modules = every driver Toradex's kernel builds as a module (Mallow
# peripherals, the 7" DSI display bridge, panel, touch and backlight, ...).

# Image features (Yocto IMAGE_FEATURES) added to the image:
#   tools-sdk   - compilers and build tools on the target (gcc, g++, make, ...)
#   dev-pkgs    - headers and .so links (-dev packages) for everything installed
#   doc-pkgs    - documentation (man pages) for everything installed
#   tools-debug - gdb, strace, ...
LABWC_DEMO_IMAGE_FEATURES = "tools-sdk dev-pkgs doc-pkgs tools-debug"

# Packages to keep out of the image even if something recommends them.
# (Joe's Own Editor comes with the Toradex command line tools; nano is used.)
LABWC_DEMO_EXCLUDE = "joe"
