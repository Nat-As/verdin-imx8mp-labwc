# Sections above: shells and command line tools (gzip = GNU gzip/gunzip,
# man-db = "man") / NetworkManager (replaces
# connman) / Bluetooth / C and C++ development tools and Wayland headers /
# Qt 6 (meta-qt6, branch 6.11) / drivers and firmware /
# GPU and NPU compute (Vivante imx-gpu-viv: OpenCL 3.0, OpenVX + NN kernels
# for the NPU, RapidOpenVX headers, G2D 2D blitter, gmem_info;
# labwc-gpu-probe and labwc-hwaccel-check) /
# NPU machine learning (meta-imx-ml: TIM-VX, TensorFlow Lite 2.16 with the
# Python tflite_runtime, examples and the VX delegate that runs models on the
# NPU) / debug symbols for the compositor (backtraces with gdb).
# OpenCV is built with OpenCL (meta-labwc-demo opencv bbappend).
# .NET and OpenCV for C#: .NET 10 LTS runtime and SDK (dotnet, dotnet-dev),
# OpenCvSharp (C# bindings for the image's OpenCV with OpenCL) with an offline
# NuGet feed, opencv-cs-check (OpenCV/OpenCL check and C# example), the
# GPU Test demo (C#, OpenGL ES) and the OpenCV C++ samples (opencv-samples).
# kernel-modules = every driver Toradex's kernel builds as a module (Mallow
# peripherals, the 7" DSI display bridge, panel, touch and backlight, ...).

# Image features (Yocto IMAGE_FEATURES) added to the image:
#   tools-sdk   - compilers and build tools on the target (gcc, g++, make, ...)
#   dev-pkgs    - headers and .so links (-dev packages) for everything installed
#   doc-pkgs    - documentation (man pages) for everything installed
#   tools-debug - gdb, strace, ...
LABWC_DEMO_IMAGE_FEATURES = "tools-sdk dev-pkgs doc-pkgs tools-debug"

# Packages to keep out of the image even if something recommends them.
# (Joe's Own Editor comes with the Toradex command line tools; nano is used.)
LABWC_DEMO_EXCLUDE = "joe"
